# Generated by @toolsync/builtin/github-actions
# Do not edit manually, instead update your toolsync config and run `toolsync prepare`
# See: https://toolsync.vercel.app/docs/configuration

name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'main' && !contains(github.ref, 'release/') }}
jobs:
  build:
    name: Code Quality
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: '1'
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - id: checkout
        name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          lfs: true
      - id: setup-node
        name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - name: Prepare toolsync
        run: bun install --ignore-scripts && bun run build
      - id: install
        name: Install dependencies
        run: bun install
      - id: checks
        name: Code Quality Checks
        run: bun --bun turbo check lint test build --continue
      - id: ensure-clean
        name: Ensure there are no uncommitted changes
        run: git diff --exit-code || (echo "There are uncommitted changes!" && exit 1)
      - id: changesets
        if: ${{ github.event_name == 'push' }}
        name: Changesets
        uses: changesets/action@v1
        with:
          commit: 'chore: Update versions'
          title: 'chore: Update versions'
          publish: bun changeset publish
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
